<html lang="zh-Hant">
<head>

<title>Smart Clock · 雙時區、農曆與假期</title>
<style>
:root{--ink:#263337;--bg:#c7eee5;--line:#9dcfc5}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,'Helvetica Neue',sans-serif;color:var(--ink);background:var(--bg)}.dashboard{height:100dvh;min-height:420px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.panel{position:relative;display:flex;align-items:center;justify-content:center;padding:3vw}.date,.calendar{border-right:1px solid var(--line)}.date,.clockpanel{border-bottom:1px solid var(--line)}.date{flex-direction:column}.date .month{font-size:clamp(24px,3vw,48px);font-weight:600}.date .day{font-size:clamp(100px,15vw,245px);font-weight:700;line-height:1.05;letter-spacing:-.075em;padding-right:.08em}.clock{position:relative;width:min(31vw,36vh,360px);aspect-ratio:1;border-radius:50%}.tick{position:absolute;left:50%;top:50%;width:1.4px;height:9px;background:var(--ink);transform-origin:center center}.tick.major{height:17px;width:2.6px}.number{position:absolute;transform:translate(-50%,-50%);font-size:clamp(15px,1.8vw,27px)}.hand{position:absolute;left:50%;top:50%;transform-origin:50% 100%;border-radius:12px;background:var(--ink)}.hour{width:6px;height:24%;margin-left:-3px;margin-top:-24%}.minute{width:4px;height:35%;margin-left:-2px;margin-top:-35%}.second{width:2px;height:41%;margin-left:-1px;margin-top:-41%;background:#fff}.pin{position:absolute;left:50%;top:50%;width:13px;height:13px;background:var(--ink);border:3px solid white;border-radius:50%;transform:translate(-50%,-50%)}.calendar{flex-direction:column;align-items:center}.calwrap{width:min(80%,420px)}.calheading{font-size:clamp(14px,1.5vw,21px);font-weight:700;margin-bottom:14px;letter-spacing:.04em}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}.calgrid span{display:grid;place-items:center;aspect-ratio:1;font-size:clamp(12px,1.3vw,19px)}.calgrid span.datecell{position:relative;display:flex;flex-direction:column;justify-content:center;gap:1px}.calgrid .lunarlabel{font-size:clamp(8px,.75vw,11px);font-weight:400;line-height:1.1;white-space:nowrap;opacity:.72}.calgrid .festival .lunarlabel{color:#a3394b;font-weight:700;opacity:1}.calgrid .holiday::after{bottom:0!important}.calgrid .weekday{font-size:clamp(10px,1vw,14px);opacity:.65}.calgrid .today{background:#fff;border-radius:50%;font-weight:bold}.calgrid .muted{opacity:.3}.calgrid .holiday{position:relative;cursor:help}.calgrid .holiday::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#b14e5c}.calgrid .holiday.hk::after{background:#b14e5c}.calgrid .holiday.uk::after{background:#3466a1}.calgrid .holiday.both::after{background:linear-gradient(90deg,#b14e5c 50%,#3466a1 50%);width:9px}.holidayinfo{font-size:clamp(10px,1vw,13px);margin-top:10px;max-height:90px;overflow:auto;line-height:1.5}.holidayinfo .legend{margin-bottom:4px}.holidayinfo .hkmark{color:#b14e5c}.holidayinfo .ukmark{color:#3466a1}.holidayinfo .empty{opacity:.7}.calnav{display:flex;align-items:center;justify-content:space-between;gap:10px}.calnav button{background:transparent;border:0;color:var(--ink);font-size:23px;cursor:pointer;padding:2px 9px}.calnav .calheading{margin:0}.calnav{margin-bottom:10px}.weather{flex-direction:column;text-align:center}.city{font-size:clamp(25px,3vw,46px);font-weight:700}.temp{font-size:clamp(75px,10vw,160px);font-weight:700;line-height:1.1}.weathericon{font-size:clamp(25px,3vw,45px)}.condition{font-size:clamp(17px,2vw,28px);margin-top:5px}.range{font-size:clamp(14px,1.5vw,22px);margin-top:8px}.controls{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;opacity:.18;transition:opacity .2s}.controls:hover,.controls:focus-within{opacity:1}.controls button,.controls select{border:1px solid #7cb9ac;border-radius:9px;background:#eafff8;padding:8px;color:#263337;cursor:pointer}@media(max-aspect-ratio:4/5){.dashboard{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(250px,1fr));height:auto;min-height:100dvh}.panel{border-right:0;border-bottom:1px solid var(--line)}.clock{width:min(65vw,300px)}.date .day{font-size:130px}.calwrap{width:min(80%,360px)}}

/* Four-panel dual-country layout */
.calgrid .holiday.home::after{background:#b14e5c}.calgrid .holiday.other::after{background:#3466a1}.calgrid .holiday.both::after{background:linear-gradient(90deg,#b14e5c 50%,#3466a1 50%)}
.date{gap:0;text-align:center}.date .day{font-size:clamp(70px,10vw,155px)}.date .month{font-size:clamp(20px,2.2vw,34px)}
.weather-mini{display:flex;flex-direction:column;align-items:center;margin-top:4px}.weather-mini .city{font-size:clamp(15px,1.5vw,23px)}.weather-mini .temp{font-size:clamp(35px,4vw,65px);line-height:1.05}.weather-mini .condition,.weather-mini .range{font-size:clamp(12px,1.2vw,17px);margin-top:2px}.weather-mini .weathericon{font-size:clamp(18px,2vw,28px)}

@media(max-aspect-ratio:4/5){.date .day{font-size:110px}.clock{width:min(58vw,250px)}.other-time{font-size:clamp(55px,12vw,100px)}}

/* Settings + dual clock */
.other-zone{gap:7px}.other-zone .clock{width:min(24vw,28vh,280px)}
.controls{opacity:.55;z-index:10}.controls:hover,.controls:focus-within{opacity:1}.controls button{font-size:22px;min-width:43px}
.settings-backdrop[hidden]{display:none}.settings-backdrop{position:fixed;inset:0;background:#1c3b36a8;z-index:30;display:grid;place-items:center;padding:16px}
.settings-dialog{width:min(440px,100%);max-height:90dvh;overflow:auto;background:#e4faf3;color:#263337;border:1px solid #9dcfc5;border-radius:20px;padding:24px;box-shadow:0 20px 60px #173b3650;display:flex;flex-direction:column;gap:12px}
.settings-head{display:flex;justify-content:space-between;align-items:center}.settings-head h2{margin:0 0 10px}.settings-dialog label{font-weight:700;margin-top:8px}.settings-dialog select,.settings-dialog button{border:1px solid #7cb9ac;background:#f7fffc;border-radius:10px;padding:12px;color:#263337;font:inherit}.settings-head button{padding:8px 12px}.settings-dialog #settingsDone{background:#263337;color:white;margin-top:16px;cursor:pointer}
@media(max-aspect-ratio:4/5){.other-zone .clock{width:min(58vw,250px)}}
</style>
</head>

<main class="dashboard">
<section class="panel date"><div class="month" id="dateTitle"></div><div class="day" id="day"></div><div class="weather-mini"><div class="city" id="city">Hong Kong</div><div class="temp" id="temp">--°</div><div class="weathericon" id="weatherIcon">☁</div><div class="condition" id="condition">載入天氣中…</div><div class="range" id="range"></div></div></section>
<section class="panel clockpanel"><div class="clock-location" id="clockLocation">Hong Kong</div><div class="clock" id="clock"><div class="hand hour" id="hour"></div><div class="hand minute" id="minute"></div><div class="hand second" id="second"></div><div class="pin"></div></div><div class="clock-digital" id="clockDigital"></div><div class="clock-date" id="clockDate"></div></section>
<section class="panel calendar"><div class="calwrap"><div class="calnav"><button id="prevMonth" aria-label="上個月">‹</button><div class="calheading" id="calHeading"></div><button id="nextMonth" aria-label="下個月">›</button></div><div class="calgrid" id="calGrid"></div><div class="holidayinfo" id="holidayInfo" aria-live="polite"></div></div></section>
<section class="panel other-zone"><div class="clock-location" id="otherLocation">United Kingdom · London</div><div class="clock" id="otherClock"><div class="hand hour" id="otherHour"></div><div class="hand minute" id="otherMinute"></div><div class="hand second" id="otherSecond"></div><div class="pin"></div></div><div class="clock-digital" id="otherTime">--:--:--</div><div class="clock-date" id="otherDate"></div><div class="other-offset" id="otherOffset"></div></section><div class="controls"><button id="settingsOpen" aria-label="Settings">⚙</button><button id="full">⛶</button></div><div class="settings-backdrop" id="settingsBackdrop" hidden><div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-head"><h2 id="settingsTitle">Settings</h2><button id="settingsClose" aria-label="Close">✕</button></div><label id="languageLabel" for="language">Language</label><select id="language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="it">Italiano</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="hi">हिन्दी</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="id">Bahasa Indonesia</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option></select><label id="homeLabel" for="zone">Home city</label><select id="zone"></select><label id="otherLabel" for="otherZone">Second city</label><select id="otherZone" aria-label="Second city"></select><small style="line-height:1.4;opacity:.75">Weather and clocks follow the selected city and its time zone. Holidays follow the city’s country; regional and city-specific holidays may not be included.</small><button id="settingsDone">Done</button></div></div>
</main>

function parts(now,tz=zone){return Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]))}
const lunarFormatter=new Intl.DateTimeFormat('zh-Hant-u-ca-chinese',{month:'long',day:'numeric'});
const lunarDays=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const festivals={'正月-1':'農曆新年','正月-2':'年初二','正月-3':'年初三','正月-15':'元宵節','五月-5':'端午節','七月-7':'七夕','七月-15':'盂蘭節','八月-15':'中秋節','九月-9':'重陽節','十二月-8':'臘八節','十二月-30':'除夕'};
function lunarDate(y,m,d){try{const p=Object.fromEntries(lunarFormatter.formatToParts(new Date(Date.UTC(y,m-1,d,12))).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));const day=Number(p.day),month=p.month,leap=month.includes('閏');return {label:day===1?month:lunarDays[day]||p.day,festival:leap?'':festivals[`${month}-${day}`]||'',month,day}}catch{return {label:'',festival:''}}}
let shownMonth=null,holidayCache=new Map();
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
async function loadHolidays(year){const key=`${year}-${homeCode}-${otherCode}`;if(holidayCache.has(key))return;const state={loading:true,home:{},other:{},homeOK:false,otherOK:false};holidayCache.set(key,state);
const load=async code=>{const r=await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${code}`);if(!r.ok)throw Error('Unavailable');const arr=await r.json(),result={};for(const h of arr){(result[h.date]??=[]).push(h.localName||h.name)}return result};
const result=await Promise.allSettled([load(homeCode),load(otherCode)]);if(result[0].status==='fulfilled'){state.home=result[0].value;state.homeOK=true}if(result[1].status==='fulfilled'){state.other=result[1].value;state.otherOK=true}state.loading=false;if(shownMonth?.y===year)drawCalendar(shownMonth.y,shownMonth.m,shownMonth.d)}
function drawCalendar(y,m,d){shownMonth={y,m,d};const key=`${y}-${homeCode}-${otherCode}`;loadHolidays(y);const holidays=holidayCache.get(key),start=new Date(Date.UTC(y,m-1,1)).getUTCDay(),days=new Date(Date.UTC(y,m,0)).getUTCDate(),prev=new Date(Date.UTC(y,m-1,0)).getUTCDate();$('calHeading').textContent=new Intl.DateTimeFormat(locale(),{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,1))).toUpperCase();const g=$('calGrid');g.replaceChildren();for(const w of ['S','M','T','W','T','F','S']){const e=document.createElement('span');e.className='weekday';e.textContent=w;g.append(e)}let entries=[];
for(let i=0;i<42;i++){const v=i-start+1,e=document.createElement('span'),displayDay=v<1?prev+v:v>days?v-days:v;e.className='datecell '+(v<1||v>days?'muted':v===d?'today':'');const num=document.createElement('span');num.textContent=displayDay;e.append(num);if(v>=1&&v<=days){const lunar=showLunar()?lunarDate(y,m,v):{label:'',festival:''};if(showLunar()){const sub=document.createElement('small');sub.className='lunarlabel';sub.textContent=lunar.festival||lunar.label;e.append(sub);if(lunar.festival)e.classList.add('festival')}const date=iso(y,m,v),home=holidays.home[date]||[],other=holidays.other[date]||[];if(home.length||other.length){e.classList.add('holiday',home.length&&other.length?'both':home.length?'home':'other')}e.title=[lunar.festival,...home.map(t=>country(homeCode).name+': '+t),...other.map(t=>country(otherCode).name+': '+t)].filter(Boolean).join('\n');if(home.length||other.length||lunar.festival)entries.push({day:v,festival:lunar.festival,home,other})}g.append(e)}
const info=$('holidayInfo');info.replaceChildren();const legend=document.createElement('div');legend.className='legend';legend.textContent=`🔴 ${country(homeCode).name}　🔵 ${country(otherCode).name}`;info.append(legend);if(showLunar()){const note=document.createElement('div');note.className='legend';note.textContent=calendarMessage('lunar');info.append(note)}
if(holidays.loading){const e=document.createElement('div');e.textContent=calendarMessage('loading');info.append(e)}else{for(const x of entries){const e=document.createElement('div');e.textContent=`${x.day} · ${[...(x.festival?['🏮 '+x.festival]:[]),...x.home.map(t=>'🔴 '+t),...x.other.map(t=>'🔵 '+t)].join(' / ')}`;info.append(e)}if(!entries.length){const e=document.createElement('div');e.textContent=calendarMessage('empty');info.append(e)}if(!holidays.homeOK||!holidays.otherOK){const e=document.createElement('div');e.className='empty';e.textContent=calendarMessage('missing');info.append(e)}}}
function changeMonth(offset){const now=parts(new Date());const cur=shownMonth||{y:+now.year,m:+now.month,d:+now.day};const dt=new Date(Date.UTC(cur.y,cur.m-1+offset,1));drawCalendar(dt.getUTCFullYear(),dt.getUTCMonth()+1,cur.y===dt.getUTCFullYear()&&cur.m===dt.getUTCMonth()+1?+now.day:0)}
$('prevMonth').addEventListener('click',()=>changeMonth(-1));$('nextMonth').addEventListener('click',()=>changeMonth(1));
function tick(){const nowDate=new Date();const p=parts(nowDate),y=+p.year,m=+p.month,d=+p.day,h=+p.hour,mi=+p.minute,s=+p.second;$('hour').style.transform=`rotate(${(h%12)*30+mi*.5+s/120}deg)`;$('minute').style.transform=`rotate(${mi*6+s*.1}deg)`;$('second').style.transform=`rotate(${s*6}deg)`;$('clockLocation').textContent=displayZone('home');$('clockDigital').textContent=`${p.hour}:${p.minute}:${p.second}`;$('clockDate').textContent=new Intl.DateTimeFormat(locale(),{timeZone:zone,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(nowDate);const op=parts(nowDate,otherZone),oh=+op.hour,om=+op.minute,os=+op.second;$('otherHour').style.transform=`rotate(${(oh%12)*30+om*.5+os/120}deg)`;$('otherMinute').style.transform=`rotate(${om*6+os*.1}deg)`;$('otherSecond').style.transform=`rotate(${os*6}deg)`;$('otherLocation').textContent=displayZone('other');$('otherTime').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:otherZone,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(nowDate);$('otherDate').textContent=new Intl.DateTimeFormat(locale(),{timeZone:otherZone,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(nowDate);$('otherOffset').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:otherZone,timeZoneName:'short'}).formatToParts(nowDate).find(x=>x.type==='timeZoneName')?.value||'';const key=`${y}-${m}-${d}`;if(key!==lastDate){lastDate=key;$('dateTitle').textContent=new Intl.DateTimeFormat(locale(),{weekday:'short',month:'short',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d,12)));$('day').textContent=d;if(!shownMonth||shownMonth.d!==0||shownMonth.y===y&&shownMonth.m===m)drawCalendar(y,m,d)}}
const codes={0:['☀️','晴朗'],1:['🌤️','大致天晴'],2:['⛅','部分多雲'],3:['☁️','多雲'],45:['🌫️','有霧'],48:['🌫️','有霧'],51:['🌦️','微雨'],53:['🌦️','微雨'],55:['🌧️','下雨'],61:['🌧️','下雨'],63:['🌧️','下雨'],65:['🌧️','大雨'],80:['🌦️','驟雨'],81:['🌧️','驟雨'],82:['🌧️','大驟雨'],95:['⛈️','雷暴']};
let weatherRequest=0;
async function weather(){const request=++weatherRequest,c=homeCity;$('city').textContent=displayZone('home');$('condition').textContent=tr('loading');try{let lat=c.lat,lon=c.lon;
if(lat==null||lon==null)throw Error('No location coordinates');const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=${encodeURIComponent(zone)}&forecast_days=1`;const r=await fetch(u);if(!r.ok)throw Error('Network');const j=await r.json();if(request!==weatherRequest)return;$('temp').textContent=Math.round(j.current.temperature_2m)+'°';const [icon,label]=codes[j.current.weather_code]||['🌥️','天氣資料'];$('weatherIcon').textContent=icon;$('condition').textContent=!language.startsWith('zh')?({'晴朗':'Clear','大致天晴':'Mostly clear','部分多雲':'Partly cloudy','多雲':'Cloudy','有霧':'Fog','微雨':'Drizzle','下雨':'Rain','大雨':'Heavy rain','驟雨':'Showers','大驟雨':'Heavy showers','雷暴':'Thunderstorm'}[label]||'Weather'):label;$('range').textContent=`H:${Math.round(j.daily.temperature_2m_max[0])}° L:${Math.round(j.daily.temperature_2m_min[0])}°`}catch(e){if(request!==weatherRequest)return;$('temp').textContent='--°';$('condition').textContent=tr('unavailable');$('range').textContent=tr('network')}}
$('zone').addEventListener('change',e=>{homeCity=cityByKey(e.target.value)||homeCity;homeCode=homeCity.code;zone=homeCity.tz;localStorage.setItem('smartclock-home-city',cityKey(homeCity));lastDate='';shownMonth=null;holidayCache.clear();tick();weather()});
$('otherZone').addEventListener('change',e=>{otherCity=cityByKey(e.target.value)||otherCity;otherCode=otherCity.code;otherZone=otherCity.tz;localStorage.setItem('smartclock-other-city',cityKey(otherCity));lastDate='';shownMonth=null;holidayCache.clear();tick()});
$('full').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});initializeSettings();tick();setInterval(tick,1000);weather();setInterval(weather,15*60*1000);
</script></body></html>
